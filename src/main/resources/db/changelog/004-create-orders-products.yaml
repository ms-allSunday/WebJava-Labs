databaseChangeLog:
  - changeSet:
      id: 004-create-order-items-sequence
      author: Viktoriia Sabadash
      changes:
        - createSequence:
            sequenceName: order_items_seq
            startValue: 1
            incrementBy: 50

  - changeSet:
      id: 004-create-order-items-table
      author: Viktoriia Sabadash
      changes:
        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueSequenceNext: order_items_seq
              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_item_order
                    references: orders(id)
                    nullable: false
              - column:
                  name: product_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_item_product
                    references: products(id)
                    nullable: false